[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yt-recipes-cli"
version = "0.0.1"
description = "Extract recipes from YouTube videos and upload to Docmost"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Patilla Code", email = "patillacode@gmail.com"}
]
keywords = ["youtube", "recipes", "cli", "docmost", "ai", "groq"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.9.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
]

[project.scripts]
yt-recipes = "yt_recipes.cli:app"

[dependency-groups]
dev = [
    "icecream>=2.1.5",
    "pre-commit>=4.2.0",
    "ruff>=0.12.8",
    "ty>=0.0.1a1",
]
test = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/patillacode/yt-recipes-cli"
Documentation = "https://github.com/patillacode/yt-recipes-cli#readme"
Repository = "https://github.com/patillacode/yt-recipes-cli"
Issues = "https://github.com/patillacode/yt-recipes-cli/issues"


[tool.hatch.build.targets.wheel]
packages = ["yt_recipes"]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
